services:
  elasticsearch:
    build: .
    container_name: cg-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9201:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

volumes:
  es_data:
