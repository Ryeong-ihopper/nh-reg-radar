name: Self-hosted Compose CD

on:
  workflow_run:
    workflows: [Product CI]
    types: [completed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        type: choice
        options: [development, production]
      ref:
        description: Immutable commit SHA or protected branch ref to deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_PRODUCTION only for production
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Development: SSH release deploy to the shared dev VM. Auto after Product CI on dev,
  # or manual workflow_dispatch (environment=development).
  deploy-development:
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'dev' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'development')
    runs-on: [self-hosted, linux, x64, org-cg-rookies, org-deploy]
    environment: development
    concurrency:
      group: nh-ad-development-compose
      cancel-in-progress: false
    steps:
      - name: Check out verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Deploy to development VM over SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST is not configured" >&2; exit 1; }
          case "$DEPLOY_PATH" in change|"") echo "DEPLOY_PATH is not configured" >&2; exit 1;; esac
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" | ssh-add - >/dev/null
          export DEPLOY_SHA="$(git rev-parse HEAD)"
          scripts/deploy-ssh.sh

      - name: Notify Mattermost (success)
        if: success()
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
        run: |
          [ -n "${MATTERMOST_WEBHOOK_URL:-}" ] || exit 0
          text=":white_check_mark: **dev 배포 성공** — \`${GITHUB_SHA:0:8}\` → ${{ vars.DEPLOY_HOST }} ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))"
          jq -n --arg t "$text" '{text:$t}' | curl -sS -X POST -H 'Content-Type: application/json' -d @- "$MATTERMOST_WEBHOOK_URL" >/dev/null

      - name: Notify Mattermost (failure)
        if: failure()
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
        run: |
          [ -n "${MATTERMOST_WEBHOOK_URL:-}" ] || exit 0
          text=":x: **dev 배포 실패** — \`${GITHUB_SHA:0:8}\` → ${{ vars.DEPLOY_HOST }} ([run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))"
          jq -n --arg t "$text" '{text:$t}' | curl -sS -X POST -H 'Content-Type: application/json' -d @- "$MATTERMOST_WEBHOOK_URL" >/dev/null

  # Production: DORMANT. NH internal closed-network deployment is a separate manual
  # import (ADR-0083); this job is preserved for a possible future external prod
  # server. It never runs automatically and requires an explicit workflow_dispatch
  # with environment=production and confirmation=DEPLOY_PRODUCTION, plus production
  # environment variables (currently placeholders).
  deploy-production:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'production' &&
      inputs.confirmation == 'DEPLOY_PRODUCTION'
    runs-on: [self-hosted, linux, x64, org-cg-rookies, org-deploy]
    environment: production
    concurrency:
      group: nh-ad-production-compose
      cancel-in-progress: false
    steps:
      - name: Check out approved revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Deploy to production over SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          COMPOSE_PROJECT: nh-ad-prod
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo "production DEPLOY_HOST is not configured" >&2; exit 1; }
          case "$DEPLOY_PATH" in change|"") echo "production DEPLOY_PATH is not configured" >&2; exit 1;; esac
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" | ssh-add - >/dev/null
          export DEPLOY_SHA="$(git rev-parse HEAD)"
          scripts/deploy-ssh.sh
