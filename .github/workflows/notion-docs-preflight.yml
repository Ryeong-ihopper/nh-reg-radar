name: Notion Docs Preflight

# Read-only diagnosis of the Notion pages backing governance/notion-page-map.json.
# It never creates, updates, unlocks, or trashes pages; it only performs GET requests
# and emits an allowed-field-only report (no page bodies, titles, comments, or tokens).

on:
  workflow_dispatch:
    inputs:
      deep_paths:
        description: Comma-separated page-map source_paths for the deep (truncated/unknown-block) check
        required: false
        default: ""
        type: string
      deep_base_sha:
        description: Optional base commit; docs changed since it are added to the deep check
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: notion-docs-sync
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A read-only diagnosis must never hold a write-capable token. This job requires a
    # dedicated read-only Notion integration token in `NOTION_READONLY_API_TOKEN` and
    # does NOT fall back to the write-capable `NOTION_API_TOKEN`. Scope the secret to
    # the `notion-readonly` environment and restrict its deployment branches to `dev`
    # so a workflow_dispatch from another ref cannot obtain the token.
    environment: notion-readonly
    env:
      NOTION_PARENT_PAGE_ID: ${{ vars.NOTION_PARENT_PAGE_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The contract test mocks ntn and must NOT receive the real Notion token.
      - name: Run preflight contract test
        run: bash tests/notion-preflight-script-test.sh

      - name: Validate configured scope
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_READONLY_API_TOKEN }}
        run: |
          if [ -z "$NOTION_API_TOKEN" ]; then
            echo "::error::NOTION_READONLY_API_TOKEN is not set. This diagnostic requires a dedicated read-only Notion integration token and does not fall back to the write token." >&2
            exit 1
          fi
          test -n "$NOTION_PARENT_PAGE_ID"

      - name: Install official Notion CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://ntn.dev | NTN_VERSION=v0.19.0 NTN_INSTALL_DIR="$HOME/.local/bin" bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Notion connection
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_READONLY_API_TOKEN }}
        run: ntn api v1/users/me | jq -e '.id and .name'

      - name: Run read-only preflight
        id: preflight
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_READONLY_API_TOKEN }}
          NOTION_PREFLIGHT_DEEP_PATHS: ${{ inputs.deep_paths }}
          NOTION_PREFLIGHT_DEEP_BASE_SHA: ${{ inputs.deep_base_sha }}
        run: scripts/notion-docs-preflight.sh --check

      - name: Upload preflight report
        if: always() && hashFiles('notion-preflight-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: notion-preflight-result-${{ github.run_id }}
          path: notion-preflight-result.json
          if-no-files-found: error
          retention-days: 14
