name: Provider-Free Release Readiness

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      run_recovery_smoke:
        description: Run the provider-free fresh/restart/outage recovery rehearsal
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  provider-free-release-gate:
    runs-on: [self-hosted, linux, x64, org-ci, large]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/frontend/package-lock.json

      - name: Install deterministic dependencies
        run: |
          uv sync --all-packages --dev
          npm ci --ignore-scripts
          npm --prefix apps/frontend ci

      - name: Check static contracts
        run: |
          uv run ruff check .
          uv run ruff format --check tests/release
          uv run mypy
          npm run openapi:check
          npm --prefix apps/frontend run lint
          npm --prefix apps/frontend run typecheck
          npm --prefix apps/frontend run test
          npm --prefix apps/frontend run build

      - name: Validate G009 evidence trace
        run: >-
          python3 scripts/validate_goal_manifest.py
          governance/goal-manifests/G009-m8-release.json

      - name: Run exact G009 provider-free evidence
        shell: bash
        run: |
          set +e
          uv run pytest tests/e2e -q \
            --junitxml=/tmp/g009-provider-free-junit.xml
          test_exit=$?
          set -e
          TEST_EXIT="$test_exit" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          manifest = json.loads(
              Path("governance/goal-manifests/G009-m8-release.json").read_text(
                  encoding="utf-8"
              )
          )
          expected = manifest["automation"]["provider_free"]["expected"]
          exact_expected = {"passed": 4, "failed": 0, "skipped": 0}
          if not isinstance(expected, dict) or set(expected) != set(exact_expected):
              raise SystemExit(
                  "provider-free manifest counts must use exactly "
                  f"these keys: {sorted(exact_expected)}"
              )
          if any(type(value) is not int for value in expected.values()):
              raise SystemExit("provider-free manifest counts must be integers")
          if expected != exact_expected:
              raise SystemExit(
                  f"provider-free manifest counts must be exactly {exact_expected}"
              )
          junit_path = Path("/tmp/g009-provider-free-junit.xml")
          try:
              root = ElementTree.parse(junit_path).getroot()
          except (OSError, ElementTree.ParseError) as error:
              raise SystemExit(f"provider-free JUnit is unreadable: {error}") from error
          if root.tag == "testsuite":
              suites = [root]
          elif root.tag == "testsuites":
              suites = root.findall("testsuite")
          else:
              raise SystemExit(f"provider-free JUnit has unsupported root: {root.tag}")
          if not suites:
              raise SystemExit("provider-free JUnit contains no test suites")
          count_fields = ("tests", "failures", "errors", "skipped")
          counts = dict.fromkeys(count_fields, 0)
          for index, suite in enumerate(suites):
              missing = [key for key in count_fields if key not in suite.attrib]
              if missing:
                  raise SystemExit(
                      "provider-free JUnit suite "
                      f"{index} is missing required count attributes: {missing}"
                  )
              for key in count_fields:
                  try:
                      value = int(suite.attrib[key])
                  except ValueError as error:
                      raise SystemExit(
                          f"provider-free JUnit suite {index} has invalid {key} count"
                      ) from error
                  if value < 0:
                      raise SystemExit(
                          f"provider-free JUnit suite {index} has negative {key} count"
                      )
                  counts[key] += value
          actual = {
              "passed": counts["tests"]
              - counts["failures"]
              - counts["errors"]
              - counts["skipped"],
              "failed": counts["failures"] + counts["errors"],
              "skipped": counts["skipped"],
          }
          if actual != exact_expected:
              raise SystemExit(
                  f"provider-free count mismatch: expected {exact_expected}, got {actual}"
              )
          if int(os.environ["TEST_EXIT"]) != 0:
              raise SystemExit(f"provider-free pytest failed with {os.environ['TEST_EXIT']}")
          print(f"G009 provider-free counts verified: {actual}")
          PY

      - name: Run deterministic product regressions
        run: uv run python -m pytest -m "not external_ai and not slow" -q

      - name: Run deterministic M8 E2E and release gates
        run: uv run python -m pytest tests/e2e tests/release -m "not external_ai" -q

      - name: Validate documentation governance
        run: |
          scripts/check-doc-consistency.sh
          python3 -m scripts.doc_guard validate --scope all
          python3 -m unittest discover -s tests/governance -v

  provider-free-recovery-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_recovery_smoke
    needs: provider-free-release-gate
    runs-on: [self-hosted, linux, x64, org-build, large]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python workspace
        run: uv sync --all-packages --dev

      - name: Prove live-volume repeat-up safety first
        env:
          NH_RUN_G011_DOCKER_REGRESSION: "1"
        run: uv run pytest tests/integration/test_compose_bootstrap_repeat_up.py -q

      - name: Run provider-free migration and recovery rehearsal
        run: >-
          bash scripts/release-smoke.sh
          --env-file .env.prod.example
          --fresh-project
          --with-restart-and-outages
