name: M8 Provider-Free Release Readiness

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      run_recovery_smoke:
        description: Run the provider-free fresh/restart/outage recovery rehearsal
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  provider-free-release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/frontend/package-lock.json

      - name: Install deterministic dependencies
        run: |
          uv sync --all-packages --dev
          npm ci --ignore-scripts
          npm --prefix apps/frontend ci

      - name: Check static contracts
        run: |
          uv run ruff check .
          uv run ruff format --check tests/release
          uv run mypy
          npm run openapi:check
          npm --prefix apps/frontend run lint
          npm --prefix apps/frontend run typecheck
          npm --prefix apps/frontend run test
          npm --prefix apps/frontend run build

      - name: Validate G009 evidence trace
        run: >-
          python3 scripts/validate_goal_manifest.py
          governance/goal-manifests/G009-m8-release.json

      - name: Run exact G009 provider-free evidence
        shell: bash
        run: |
          set +e
          uv run pytest tests/e2e -q \
            --junitxml=/tmp/g009-provider-free-junit.xml
          test_exit=$?
          set -e
          TEST_EXIT="$test_exit" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          manifest = json.loads(
              Path("governance/goal-manifests/G009-m8-release.json").read_text(
                  encoding="utf-8"
              )
          )
          expected = manifest["automation"]["provider_free"]["expected"]
          root = ElementTree.parse("/tmp/g009-provider-free-junit.xml").getroot()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          counts = {
              key: sum(int(suite.attrib.get(key, 0)) for suite in suites)
              for key in ("tests", "failures", "errors", "skipped")
          }
          actual = {
              "passed": counts["tests"]
              - counts["failures"]
              - counts["errors"]
              - counts["skipped"],
              "failed": counts["failures"] + counts["errors"],
              "skipped": counts["skipped"],
          }
          if actual != expected:
              raise SystemExit(
                  f"provider-free count mismatch: expected {expected}, got {actual}"
              )
          if int(os.environ["TEST_EXIT"]) != 0:
              raise SystemExit(f"provider-free pytest failed with {os.environ['TEST_EXIT']}")
          print(f"G009 provider-free counts verified: {actual}")
          PY

      - name: Run deterministic product regressions
        run: uv run python -m pytest -m "not external_ai and not slow" -q

      - name: Run deterministic M8 E2E and release gates
        run: uv run python -m pytest tests/e2e tests/release -m "not external_ai" -q

      - name: Validate documentation governance
        run: |
          scripts/check-doc-consistency.sh
          python3 -m scripts.doc_guard validate --scope all
          python3 -m unittest discover -s tests/governance -v

  provider-free-recovery-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_recovery_smoke
    needs: provider-free-release-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python workspace
        run: uv sync --all-packages --dev

      - name: Prove live-volume repeat-up safety first
        env:
          NH_RUN_G011_DOCKER_REGRESSION: "1"
        run: uv run pytest tests/integration/test_compose_bootstrap_repeat_up.py -q

      - name: Run provider-free migration and recovery rehearsal
        run: >-
          bash scripts/release-smoke.sh
          --env-file .env.prod.example
          --fresh-project
          --with-restart-and-outages
