services:
  frontend:
    build:
      target: development
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]

  backend:
    build:
      target: development
    command:
      - uvicorn
      - nh_ad_backend.main:create_app
      - --factory
      - --app-dir
      - src
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./apps/backend:/app
      - ./docs/규정 및 가이드라인:/reference-documents:ro

  worker:
    build:
      target: development
    command:
      - uvicorn
      - nh_ad_worker.main:app
      - --app-dir
      - src
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --reload
    ports:
      - "127.0.0.1:${WORKER_PORT:-8001}:8001"
    volumes:
      - ./apps/worker:/app

  opendataloader-pdf:
    ports:
      - "127.0.0.1:${OPENDATALOADER_PDF_PORT:-8091}:8091"

  paddleocr:
    ports:
      - "127.0.0.1:${PADDLEOCR_PORT:-8092}:8092"

  rhwp:
    ports:
      - "127.0.0.1:${RHWP_PORT:-8093}:8093"

  document-processor:
    ports:
      - "127.0.0.1:${DOCUMENT_PROCESSOR_PORT:-8094}:8094"

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  minio:
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"

  qdrant:
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"

  opensearch:
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
