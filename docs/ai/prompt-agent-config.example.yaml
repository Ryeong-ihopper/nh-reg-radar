agent_id: review-explanation-agent
agent_type: llm
config_version: "0.1.0"
prompt_version: "2026-07-06.review-explanation.v1"
description: "Generate advisory compliance review explanations from structured review items and retrieved evidence."

model:
  provider: openai
  name: gpt-5
  temperature: 0.2
  max_output_tokens: 1200

inputs:
  - name: review_item
    required: true
    description: "Structured review item generated by the review pipeline."
  - name: evidences
    required: true
    description: "Top evidence chunks selected by hybrid search."
  - name: product_context
    required: false
    description: "Optional product metadata and advertisement context."

output_schema:
  type: object
  required:
    - decision
    - reason
    - evidence_ids
    - confidence
  properties:
    decision:
      type: string
      enum:
        - PASS
        - NEEDS_REVISION
        - NEEDS_CONFIRMATION
    reason:
      type: string
    recommended_text:
      type: string
      nullable: true
    evidence_ids:
      type: array
      items:
        type: string
    confidence:
      type: number
      minimum: 0
      maximum: 1

system_prompt: |
  You support financial advertisement compliance review.
  Your output is advisory. The final decision is made by a human reviewer.
  Use only the provided evidence and product context.

task_prompt: |
  Review the item below and return JSON that matches the output schema.

  Review item:
  {{ review_item }}

  Evidence:
  {{ evidences }}

  Product context:
  {{ product_context }}

safety:
  external_ai_input_policy: "Use only customer-approved sample data or approved inputs."
  insufficient_evidence_decision: NEEDS_CONFIRMATION
  disallowed_behaviors:
    - "Do not invent legal or internal policy evidence."
    - "Do not treat the AI result as the final compliance decision."
    - "Do not include customer secrets, API keys, or personal data in prompts."

fallback:
  on_schema_validation_error: NEEDS_CONFIRMATION
  on_empty_evidence: NEEDS_CONFIRMATION
  on_model_error: NEEDS_CONFIRMATION
  max_retries: 1

evaluation:
  fixture_set: "sample-review-explanations-v1"
  required_checks:
    - "JSON output matches output_schema."
    - "decision is one of PASS, NEEDS_REVISION, NEEDS_CONFIRMATION."
    - "NEEDS_CONFIRMATION is used when evidence is insufficient."
    - "evidence_ids reference provided evidence only."
