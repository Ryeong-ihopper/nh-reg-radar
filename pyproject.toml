[project]
name = "nh-ad-compliance"
version = "0.1.0"
description = "NH advertisement compliance PoC monorepo"
requires-python = ">=3.11,<3.12"
dependencies = [
  "nh-ad-backend",
  "nh-ad-ai-providers",
  "nh-ad-parser-contracts",
  "nh-ad-worker",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "mypy>=1.17,<2",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pytest>=8.4,<9",
  "ruff>=0.12,<0.13",
]

[tool.uv.workspace]
members = ["apps/backend", "apps/worker", "packages/ai-providers", "packages/parser-contracts"]

[tool.uv.sources]
nh-ad-backend = { workspace = true }
nh-ad-ai-providers = { workspace = true }
nh-ad-parser-contracts = { workspace = true }
nh-ad-worker = { workspace = true }

[tool.ruff]
target-version = "py311"
line-length = 100
# parser-pipeline/은 nh-parser-fin subtree다. 자체 pyproject·uv.lock·테스트로 검사한다.
extend-exclude = ["rag-pipeline/legacy", "parser-pipeline"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = [
  "apps/backend/src",
  "apps/worker/src",
  "packages/ai-providers/src",
  "packages/parser-contracts/src",
  "scripts/check_environment_isolation.py",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
# pytest 기본값에 parser-pipeline(별도 환경에서 실행하는 파서 subtree)만 추가한다.
norecursedirs = [
  "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}",
  "parser-pipeline",
]
markers = [
  "external_ai: requires an external AI provider",
  "slow: long-running test excluded from the PR gate",
]
