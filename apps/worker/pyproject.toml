[project]
name = "nh-ad-worker"
version = "0.1.0"
description = "Queue worker platform boundary for the NH advertisement compliance PoC"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.139.2",
  "nh-ad-ai-providers",
  "nh-ad-parser-contracts",
  "pydantic-settings==2.14.2",
  "pypdf>=5.9,<6",
  "psycopg[binary]==3.2.10",
  "redis==8.0.1",
  "SQLAlchemy==2.0.51",
  "uvicorn[standard]==0.51.0",
]

[tool.uv.sources]
nh-ad-ai-providers = { workspace = true }
nh-ad-parser-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nh_ad_worker"]
