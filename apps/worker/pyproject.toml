[project]
name = "nh-ad-worker"
version = "0.1.0"
description = "Queue worker platform boundary for the NH advertisement compliance PoC"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<0.117",
  "pydantic-settings>=2.10,<3",
  "redis>=6,<7",
  "uvicorn[standard]>=0.35,<0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nh_ad_worker"]
