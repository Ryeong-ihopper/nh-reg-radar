[project]
name = "nh-ad-parser-contracts"
version = "0.1.0"
description = "Versioned parser and OCR contracts for NH advertisement compliance"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.11,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nh_ad_parser_contracts"]
