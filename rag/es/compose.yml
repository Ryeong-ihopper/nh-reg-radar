# 로컬 Elasticsearch — DAP 로 가기 전에 nori 로 진짜 숫자를 재기 위한 것.
#
#   docker compose -f rag/es/compose.yml up -d
#   python rag/es_search.py --setup --measure
#
# 보안을 끄고 로컬에만 연다. 실측용 일회성 인스턴스라 데이터 보존도 안 한다 —
# 색인은 rule_index.jsonl 에서 언제든 다시 만든다.
services:
  es:
    build: .
    container_name: cg-es-nori
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
