name: nh-operational-server
services:
  web:
    image: ${NH_OPERATIONAL_IMAGE:?set an immutable image tag}
    build:
      context: ../..
      dockerfile: infra/operational/Dockerfile
    # GPU/search endpoints can remain bound to the server's loopback interface.
    # Only this application is managed by this Compose project.
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=2g,mode=1777
      - /home/nhapp:uid=10001,gid=10001,mode=0700
    volumes:
      - ${NH_SERVER_STATE:?server state directory}:/state
      - ${NH_SERVER_WORK:?server work directory}:/work
      - ${NH_SERVER_CONFIG:?private configuration directory}:/run/config:ro
      - ${NH_SERVER_RULES:?authoritative rule sources}:/data:ro
