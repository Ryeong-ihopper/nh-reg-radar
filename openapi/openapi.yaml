openapi: 3.1.0
info:
  title: NH Advertisement Compliance API
  description: Source contract for the advertisement-compliance PoC. Capability-specific paths and
    schemas are added only when their implementation slice begins.
  version: 0.8.0
servers:
  - url: /api/v1
tags:
  - name: Advertisements
paths:
  /standards:
    get:
      description: Lists standards for standard managers and system administrators.
      operationId: listStandards
      parameters:
        - $ref: "#/components/parameters/Keyword"
        - in: query
          name: evidenceType
          schema:
            $ref: "#/components/schemas/EvidenceType"
        - $ref: "#/components/parameters/ProductGroupQuery"
        - $ref: "#/components/parameters/AdvertisementTypeQuery"
        - in: query
          name: ruleType
          schema:
            $ref: "#/components/schemas/RuleType"
        - in: query
          name: activeOnly
          schema:
            default: true
            type: boolean
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardPage"
          description: Scope-authorized standards page.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      tags:
        - Standards
      security:
        - BearerAuth: []
    post:
      description: Creates a standard and immutable version 1.0 from directly entered text.
      operationId: createStandard
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateStandardRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardCreated"
          description: Standard, immutable version, and evidence created.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
      tags:
        - Standards
      security:
        - BearerAuth: []
  /standards/{standardId}:
    get:
      description: Returns the standard master with its current immutable version.
      operationId: getStandard
      parameters:
        - $ref: "#/components/parameters/StandardId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardDetail"
          description: Current standard master and immutable version.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - Standards
      security:
        - BearerAuth: []
    patch:
      description: Appends a new immutable standard version; it never overwrites history.
      operationId: updateStandard
      parameters:
        - $ref: "#/components/parameters/StandardId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStandardRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardDetail"
          description: Newly created immutable version.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      tags:
        - Standards
      security:
        - BearerAuth: []
  /standards/{standardId}/deactivate:
    patch:
      description: Soft-deactivates a standard and excludes its chunks from search.
      operationId: deactivateStandard
      parameters:
        - $ref: "#/components/parameters/StandardId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivateStandardRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardDetail"
          description: Deactivated standard.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - Standards
      security:
        - BearerAuth: []
  /standards/{standardId}/histories:
    get:
      description: Lists immutable versions in descending effective/version order.
      operationId: listStandardHistories
      parameters:
        - $ref: "#/components/parameters/StandardId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardHistoryPage"
          description: Immutable version history.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - Standards
      security:
        - BearerAuth: []
  /evidences/search:
    get:
      description: Searches only active, basis-date-valid chunks. Hybrid mode requires both Qdrant and
        OpenSearch; a backend failure is never converted to a keyword-only or vector-only success.
      operationId: searchEvidences
      parameters:
        - in: query
          name: keyword
          required: true
          schema:
            maxLength: 300
            minLength: 1
            type: string
        - in: query
          name: evidenceType
          schema:
            $ref: "#/components/schemas/EvidenceType"
        - $ref: "#/components/parameters/ProductGroupQuery"
        - $ref: "#/components/parameters/AdvertisementTypeQuery"
        - in: query
          name: ruleType
          schema:
            $ref: "#/components/schemas/RuleType"
        - in: query
          name: effectiveDate
          schema:
            format: date
            type: string
        - in: query
          name: searchMode
          schema:
            $ref: "#/components/schemas/SearchMode"
        - in: query
          name: limit
          schema:
            default: 20
            maximum: 20
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/EvidenceSearchResult"
                maxItems: 20
                type: array
          description: Deterministically ranked evidence chunks.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/SearchUnavailable"
      tags:
        - Evidence
      security:
        - BearerAuth: []
  /evidences/{evidenceId}:
    get:
      description: Returns evidence bound to one immutable standard version.
      operationId: getEvidence
      parameters:
        - $ref: "#/components/parameters/EvidenceId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceDetail"
          description: Evidence detail for the selected immutable standard version.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - Evidence
      security:
        - BearerAuth: []
  /standards/{standardId}/versions/{standardVersionId}/reindex:
    post:
      description: Queues an idempotent deterministic-ID reindex for directly entered text.
      operationId: requestStandardReindex
      parameters:
        - $ref: "#/components/parameters/StandardId"
        - $ref: "#/components/parameters/StandardVersionId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReindexStandardRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardReindexJob"
          description: Reindex job accepted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/SearchUnavailable"
      tags:
        - Search Operations
      security:
        - BearerAuth: []
  /standard-reindex-jobs/{jobId}:
    get:
      description: Returns independent Qdrant and OpenSearch processing states.
      operationId: getStandardReindexJob
      parameters:
        - $ref: "#/components/parameters/ReindexJobId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardReindexJob"
          description: Reindex status including independent backend results.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/SearchUnavailable"
      tags:
        - Search Operations
      security:
        - BearerAuth: []
  /evidences/{evidenceId}/chunks:
    get:
      description: Administrator-only chunk inspection without internal index identifiers.
      operationId: listEvidenceChunks
      parameters:
        - $ref: "#/components/parameters/EvidenceId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceChunkPage"
          description: Redacted evidence chunk page.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - Search Operations
      security:
        - BearerAuth: []
  /evidence-chunks/{evidenceChunkId}:
    get:
      description: Administrator-only redacted chunk detail.
      operationId: getEvidenceChunk
      parameters:
        - $ref: "#/components/parameters/EvidenceChunkId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceChunk"
          description: Redacted evidence chunk detail.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
        - Search Operations
      security:
        - BearerAuth: []
  /advertisements/{advertisementId}/reviews:
    post:
      tags:
        - Reviews
      operationId: requestAdvertisementReview
      description: Persists review/job/steps before minimal Redis delivery.
      parameters:
        - $ref: "#/components/parameters/AdvertisementId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "202":
          description: Review job accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
        - BearerAuth: []
    get:
      tags:
        - Reviews
      operationId: listAdvertisementReviews
      description: Lists immutable review rounds for an advertisement.
      parameters:
        - $ref: "#/components/parameters/AdvertisementId"
      responses:
        "200":
          description: Immutable review history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewHistory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - BearerAuth: []
  /reviews/{reviewId}/status:
    get:
      tags:
        - Reviews
      operationId: getReviewStatus
      description: Returns PostgreSQL-sourced job and step progress.
      parameters:
        - $ref: "#/components/parameters/ReviewId"
      responses:
        "200":
          description: PostgreSQL-sourced job and step progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - BearerAuth: []
  /reviews/{reviewId}/events:
    get:
      tags:
        - Reviews
      operationId: streamReviewProgress
      description: Streams PostgreSQL-sourced review progress changes as server-sent events.
      parameters:
        - $ref: "#/components/parameters/ReviewId"
      responses:
        "200":
          description: Progress events. Each `progress` event contains a ReviewProgress payload.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - BearerAuth: []
  /reviews/{reviewId}/rerun:
    post:
      tags:
        - Reviews
      operationId: rerunReview
      description: Creates a new review round without overwriting history.
      parameters:
        - $ref: "#/components/parameters/ReviewId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RerunReviewRequest"
      responses:
        "202":
          description: New review round accepted without overwriting history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RerunReviewAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
        - BearerAuth: []
  /reviews/{reviewId}/summary:
    get:
      tags:
        - Review Results
      operationId: getReviewSummary
      description: Returns the immutable standard-version snapshot and risk summary.
      parameters:
        - $ref: "#/components/parameters/ReviewId"
      responses:
        "200":
          description: Scoped review result returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - BearerAuth: []
  /reviews/{reviewId}/items:
    get:
      tags:
        - Review Results
      operationId: listReviewItems
      description: Lists scoped result items without hiding evidence insufficiency or search failure.
      parameters:
        - $ref: "#/components/parameters/ReviewId"
        - $ref: "#/components/parameters/ReviewTypeQuery"
        - $ref: "#/components/parameters/RiskLevelQuery"
        - $ref: "#/components/parameters/ResultStatusQuery"
        - $ref: "#/components/parameters/IncludeAppropriateQuery"
        - $ref: "#/components/parameters/EvidenceRequiredQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Scoped review result returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItemPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - BearerAuth: []
  /reviews/{reviewId}/items/{reviewItemId}:
    get:
      tags:
        - Review Results
      operationId: getReviewItem
      description: Returns risk rationale, frozen evidence versions, and optional display location.
      parameters:
        - $ref: "#/components/parameters/ReviewId"
        - $ref: "#/components/parameters/ReviewItemId"
      responses:
        "200":
          description: Scoped review result returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewItemDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - BearerAuth: []
  /reviews/{reviewId}/annotations:
    get:
      tags:
        - Annotations
      operationId: listReviewAnnotations
      description: Returns BOX, TEXT_HIGHLIGHT, or list fallback annotations.
      parameters:
        - $ref: "#/components/parameters/ReviewId"
        - $ref: "#/components/parameters/PageNoQuery"
        - $ref: "#/components/parameters/ReviewTypeQuery"
        - $ref: "#/components/parameters/RiskLevelQuery"
      responses:
        "200":
          description: Scoped review result returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - BearerAuth: []
  /auth/login:
    post:
      summary: Login
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Successful Response
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too Many Requests
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/refresh:
    post:
      summary: Refresh
      operationId: refreshAccessToken
      security:
        - RefreshCookie: []
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
  /auth/logout:
    post:
      summary: Logout
      operationId: logout
      security:
        - RefreshCookie: []
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            type: string
            format: uri
      responses:
        "204":
          description: Successful Response
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
  /users/me:
    get:
      summary: Get Me
      operationId: getCurrentUser
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserContext"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - BearerAuth: []
  /codes/{codeGroup}:
    get:
      summary: List Codes
      operationId: listCommonCodes
      security:
        - BearerAuth: []
      parameters:
        - name: codeGroup
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CodeGroup"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommonCode"
                title: Response Listcommoncodes
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
  /advertisements:
    get:
      summary: List Advertisements
      operationId: listAdvertisements
      security:
        - BearerAuth: []
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                maxLength: 300
              - type: "null"
            title: Keyword
        - name: productGroup
          in: query
          required: false
          schema:
            anyOf:
              - $ref: "#/components/schemas/ProductGroup"
              - type: "null"
            title: Productgroup
        - name: advertisementType
          in: query
          required: false
          schema:
            anyOf:
              - $ref: "#/components/schemas/AdvertisementType"
              - type: "null"
            title: Advertisementtype
        - name: reviewStatus
          in: query
          required: false
          schema:
            anyOf:
              - $ref: "#/components/schemas/ReviewStatus"
              - type: "null"
            title: Reviewstatus
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            title: Page
        - name: size
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 20
            title: Size
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvertisementPage"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
    post:
      summary: Create Advertisement
      operationId: createAdvertisement
      security:
        - BearerAuth: []
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvertisementCreated"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unsupported Media Type
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateAdvertisementRequest"
  /advertisements/{advertisementId}:
    get:
      summary: Get Advertisement
      operationId: getAdvertisement
      security:
        - BearerAuth: []
      parameters:
        - name: advertisementId
          in: path
          required: true
          schema:
            type: string
            pattern: ^ADV-[A-Za-z0-9-]+$
            title: Advertisementid
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvertisementDetail"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not Found
    delete:
      summary: Delete Advertisement
      description: System administrators logically delete an advertisement and hide its review results.
      operationId: deleteAdvertisement
      tags:
