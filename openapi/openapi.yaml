openapi: 3.1.0
info:
  title: NH Advertisement Compliance API
  description: >-
    Source contract for the advertisement-compliance PoC. Capability-specific
    paths and schemas are added only when their implementation slice begins.
  version: 0.1.0
servers:
  - url: /api/v1
paths: {}
components:
  responses:
    ErrorResponse:
      description: Standard error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - traceId
        - timestamp
      properties:
        code:
          type: string
          minLength: 1
          description: Business or system error code.
        message:
          type: string
          minLength: 1
          description: User-safe default error message.
        details:
          type: array
          description: Optional user-safe field errors or additional context.
          items:
            type: object
            additionalProperties: true
        traceId:
          type: string
          minLength: 1
          description: Request trace identifier.
        timestamp:
          type: string
          format: date-time
          description: Time at which the error occurred.
      example:
        code: FILE_NOT_SUPPORTED
        message: 지원하지 않는 파일 형식입니다.
        details:
          - field: advertisementFile
            reason: jpg, jpeg, png, pdf, hwp, hwpx 파일만 업로드할 수 있습니다.
        traceId: req-example-000001
        timestamp: '2026-07-14T06:00:00Z'
