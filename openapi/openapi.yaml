        - createdAt
      properties:
        qaId:
          type: string
        qaSessionId:
          type: string
        question:
          type: string
        answerSummary:
          type: string
        answerDetail:
          type: string
        evidences:
          type: array
          items:
            $ref: "#/components/schemas/QaEvidence"
        suggestedPhrases:
          type: array
          items:
            type: string
        needsHumanReview:
          type: boolean
        createdAt:
          type: string
          format: date-time
    QaAnswerList:
      type: array
      items:
        $ref: "#/components/schemas/QaAnswer"
    OpinionDraftRequest:
      type: object
      additionalProperties: false
      properties:
        includeReviewItemIds:
          type: array
          items:
            type: string
        templateType:
          type: string
        additionalInstruction:
          type:
            - string
            - "null"
    OpinionDraftUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - finalContent
      properties:
        finalContent:
          type: string
          minLength: 1
    OpinionDraft:
      type: object
      additionalProperties: false
      required:
        - draftId
        - reviewId
        - draftContent
        - includedReviewItemIds
        - createdAt
      properties:
        draftId:
          type: string
        reviewId:
          type: string
        draftContent:
          type: string
        finalContent:
          type:
            - string
            - "null"
        includedReviewItemIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type:
            - string
            - "null"
          format: date-time
    ReportRequest:
      type: object
      additionalProperties: false
      properties:
        reportType:
          type: string
          enum:
            - FULL
            - SELECTED
        format:
          $ref: "#/components/schemas/ReportFormat"
        includeAnnotations:
          type: boolean
        includeSuggestions:
          type: boolean
        includeOpinionDraft:
          type: boolean
        includeEvidenceDetails:
          type: boolean
    Report:
      type: object
      additionalProperties: false
      required:
        - reportId
        - reviewId
        - sourceReportId
        - reportType
        - format
        - reportStatus
        - snapshotHash
        - snapshotVersion
        - createdAt
      properties:
        reportId:
          type: string
        reviewId:
          type: string
        sourceReportId:
          type:
            - string
            - "null"
        reportType:
          type: string
        format:
          $ref: "#/components/schemas/ReportFormat"
        reportStatus:
          $ref: "#/components/schemas/ReportStatus"
        snapshotHash:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        snapshotVersion:
          type: string
        rendererVersion:
          type:
            - string
            - "null"
        converterVersion:
          type:
            - string
            - "null"
        downloadUrl:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
    ComparisonRequest:
      type: object
      additionalProperties: false
      required:
        - baseReviewId
        - revisionId
      properties:
        baseReviewId:
          type: string
        revisionId:
          type: string
        compareTypes:
          type: array
          items:
            type: string
    AdvertisementRevisionRequest:
      type: object
      additionalProperties: false
      required:
        - revisedAdvertisementFile
      properties:
        revisionMemo:
          type: string
          maxLength: 2000
        revisedAdvertisementFile:
          type: string
          format: binary
    AdvertisementRevision:
      type: object
      additionalProperties: false
      required:
        - advertisementId
        - revisionId
        - reviewStatus
      properties:
        advertisementId:
          type: string
          pattern: ^ADV-[A-Za-z0-9-]+$
        revisionId:
          type: string
          pattern: ^REVISION-[A-Za-z0-9-]+$
        reviewStatus:
          type: string
          const: REVISED
    ComparisonItem:
      type: object
      additionalProperties: false
      required:
        - resolutionStatus
      properties:
        reviewItemId:
          type:
            - string
            - "null"
        originalText:
          type:
            - string
            - "null"
        revisedText:
          type:
            - string
            - "null"
        resolutionStatus:
          $ref: "#/components/schemas/ResolutionStatus"
        comment:
          type:
            - string
            - "null"
        reanalysisReviewId:
          type:
            - string
            - "null"
    Comparison:
      type: object
      additionalProperties: false
      required:
        - comparisonId
        - advertisementId
        - comparisonStatus
        - resolvedIssueCount
        - unresolvedIssueCount
        - newIssueCount
      properties:
        comparisonId:
          type: string
        advertisementId:
          type: string
        comparisonStatus:
          type: string
        resolvedIssueCount:
          type: integer
          minimum: 0
        unresolvedIssueCount:
          type: integer
          minimum: 0
        newIssueCount:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/ComparisonItem"
    ExcludeReasonCode:
      type: string
      enum:
        - OCR_UNREADABLE
        - PRODUCT_CONDITION_AMBIGUOUS
        - REFERENCE_NOT_PROVIDED
        - SOURCE_FILE_CORRUPTED
        - LABEL_UNCLEAR
        - DUPLICATE_SAMPLE
        - OUT_OF_SCOPE
    ValidationMetricCode:
      type: string
      enum:
        - REQUIRED_PHRASE_ACCURACY
        - MISLEADING_EXPRESSION_ACCURACY
        - EVIDENCE_PRECISION
        - HUMAN_AGREEMENT_RATE
    ValidationEvaluationStatus:
      type: string
      enum:
        - COMPLETED
        - FAILED
    ReviewSelectionPolicy:
      type: string
      enum:
        - LATEST_COMPLETED
    CreateValidationDatasetRequest:
      type: object
      additionalProperties: false
      required:
        - datasetName
        - productGroup
        - advertisementType
        - advertisementFile
      properties:
        datasetName:
          type: string
          minLength: 1
          maxLength: 300
        productGroup:
          $ref: "#/components/schemas/ProductGroup"
        advertisementType:
          $ref: "#/components/schemas/AdvertisementType"
        advertisementFile:
          type: string
          format: binary
        productConditionFile:
          type: string
          format: binary
        humanReviewComment:
          type: string
          maxLength: 4000
        labelJson:
          type: string
          description: JSON-serialized synthetic or approved label payload persisted as JSONB.
        excluded:
          type: boolean
          default: false
        excludeReasonCode:
          $ref: "#/components/schemas/ExcludeReasonCode"
        excludeReasonDetail:
          type: string
          maxLength: 2000
    ValidationDataset:
      type: object
      additionalProperties: false
      required:
        - datasetId
        - datasetName
        - productGroup
        - advertisementType
        - datasetVersion
        - excluded
        - createdAt
      properties:
        datasetId:
          type: string
          pattern: ^DATASET-[A-Za-z0-9-]+$
        datasetName:
          type: string
        productGroup:
          $ref: "#/components/schemas/ProductGroup"
        advertisementType:
          $ref: "#/components/schemas/AdvertisementType"
        advertisementId:
          type:
            - string
            - "null"
        sampleFileId:
          type:
            - string
            - "null"
        productConditionFileId:
          type:
            - string
            - "null"
        humanReviewComment:
          type:
            - string
            - "null"
        labelJson:
          type:
            - object
            - "null"
          additionalProperties: true
        datasetVersion:
          type: integer
          minimum: 1
        excluded:
          type: boolean
        excludeReasonCode:
          oneOf:
            - $ref: "#/components/schemas/ExcludeReasonCode"
            - type: "null"
        excludeReasonDetail:
          type:
            - string
            - "null"
        excludedBy:
          type:
            - string
            - "null"
        excludedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type:
            - string
            - "null"
          format: date-time
    ValidationDatasetPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ValidationDataset"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    ValidationJudgmentInput:
      type: object
      additionalProperties: false
      required:
        - targetText
        - reviewType
        - expectedStatus
      properties:
        targetText:
          type: string
          minLength: 1
        reviewType:
          $ref: "#/components/schemas/ReviewType"
        expectedStatus:
          $ref: "#/components/schemas/ReviewResultStatus"
        riskLevel:
          oneOf:
            - $ref: "#/components/schemas/RiskLevel"
            - type: "null"
        comment:
          type:
            - string
            - "null"
        excluded:
          type: boolean
          default: false
        excludeReasonCode:
          oneOf:
            - $ref: "#/components/schemas/ExcludeReasonCode"
            - type: "null"
        excludeReasonDetail:
          type:
            - string
            - "null"
    CreateValidationJudgmentsRequest:
      type: object
      additionalProperties: false
      required:
        - judgments
      properties:
        judgments:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ValidationJudgmentInput"
    ValidationJudgment:
      type: object
      additionalProperties: false
      required:
        - judgmentId
        - datasetId
        - targetText
        - reviewType
        - expectedStatus
        - excluded
        - judgmentVersion
        - judgedBy
        - judgedAt
      properties:
        judgmentId:
          type: string
          pattern: ^JUDG-[A-Za-z0-9-]+$
        datasetId:
          type: string
          pattern: ^DATASET-[A-Za-z0-9-]+$
        targetText:
          type: string
        reviewType:
          $ref: "#/components/schemas/ReviewType"
        expectedStatus:
          $ref: "#/components/schemas/ReviewResultStatus"
        riskLevel:
          oneOf:
            - $ref: "#/components/schemas/RiskLevel"
            - type: "null"
        comment:
          type:
            - string
            - "null"
        excluded:
          type: boolean
        excludeReasonCode:
          oneOf:
            - $ref: "#/components/schemas/ExcludeReasonCode"
            - type: "null"
        excludeReasonDetail:
          type:
            - string
            - "null"
        judgmentVersion:
          type: integer
          minimum: 1
        judgedBy:
          type: string
        judgedAt:
          type: string
          format: date-time
    ValidationJudgmentsCreated:
      type: object
      additionalProperties: false
      required:
        - datasetId
        - judgments
      properties:
        datasetId:
          type: string
          pattern: ^DATASET-[A-Za-z0-9-]+$
        judgments:
          type: array
          items:
            $ref: "#/components/schemas/ValidationJudgment"
    CreateValidationEvaluationRequest:
      type: object
      additionalProperties: false
      required:
        - datasetIds
        - metrics
        - excludeInvalidSamples
        - reviewSelectionPolicy
      properties:
        datasetIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: ^DATASET-[A-Za-z0-9-]+$
        metrics:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ValidationMetricCode"
        excludeInvalidSamples:
          type: boolean
        reviewSelectionPolicy:
          $ref: "#/components/schemas/ReviewSelectionPolicy"
    ValidationExclusionSummary:
      type: object
      additionalProperties: false
      required:
        - excludeReasonCode
        - count
      properties:
        excludeReasonCode:
          $ref: "#/components/schemas/ExcludeReasonCode"
        count:
          type: integer
          minimum: 1
    ValidationMetric:
      type: object
      additionalProperties: false
      required:
        - metricCode
        - metricName
        - score
        - numerator
        - denominator
        - excludedCount
        - partialCount
        - notApplicable
        - targetScore
        - achieved
      properties:
        metricCode:
          $ref: "#/components/schemas/ValidationMetricCode"
        metricName:
          type: string
        score:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 100
        numerator:
          type: number
          minimum: 0
          multipleOf: 0.5
        denominator:
          type: integer
          minimum: 0
        excludedCount:
          type: integer
          minimum: 0
        partialCount:
          type: integer
          minimum: 0
        notApplicable:
          type: boolean
        targetScore:
          type: number
          minimum: 0
          maximum: 100
        achieved:
          type: boolean
    ValidationVersionSnapshot:
      type: object
      additionalProperties: false
      required:
        - standardVersionIds
        - modelVersion
        - promptVersion
        - parserOcrPolicy
        - ragSearchPolicy
      properties:
        standardVersionIds:
          type: array
          items:
            type: string
        modelVersion:
          type: string
        promptVersion:
          type: string
        parserOcrPolicy:
          type: string
        ragSearchPolicy:
          type: string
    ValidationEvaluation:
      type: object
      additionalProperties: false
      required:
        - evaluationId
        - evaluationStatus
        - snapshotHash
        - snapshotCreatedAt
        - datasetSnapshotCount
        - reviewSelectionPolicy
        - versionSnapshot
        - exclusionSummary
        - metrics
      properties:
        evaluationId:
          type: string
          pattern: ^EVAL-[A-Za-z0-9-]+$
        evaluationStatus:
          $ref: "#/components/schemas/ValidationEvaluationStatus"
        snapshotHash:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        snapshotCreatedAt:
          type: string
          format: date-time
        datasetSnapshotCount:
          type: integer
          minimum: 0
        reviewSelectionPolicy:
          $ref: "#/components/schemas/ReviewSelectionPolicy"
        versionSnapshot:
          $ref: "#/components/schemas/ValidationVersionSnapshot"
        exclusionSummary:
          type: array
          items:
            $ref: "#/components/schemas/ValidationExclusionSummary"
        metrics:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/ValidationMetric"
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RefreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
  parameters:
    AdvertisementTypeQuery:
      in: query
      name: advertisementType
      schema:
        $ref: "#/components/schemas/AdvertisementType"
    EvidenceChunkId:
      in: path
      name: evidenceChunkId
      required: true
      schema:
        pattern: ^ECH-[A-Za-z0-9-]+$
        type: string
    EvidenceId:
      in: path
      name: evidenceId
      required: true
      schema:
        pattern: ^EVD-[A-Za-z0-9-]+$
        type: string
    Keyword:
      in: query
      name: keyword
      schema:
        maxLength: 300
        type: string
    Page:
      in: query
      name: page
      schema:
        default: 1
        minimum: 1
        type: integer
    ProductGroupQuery:
      in: query
      name: productGroup
      schema:
        $ref: "#/components/schemas/ProductGroup"
    ReindexJobId:
      in: path
      name: jobId
      required: true
      schema:
        pattern: ^SRJ-[A-Za-z0-9-]+$
        type: string
    Size:
      in: query
      name: size
      schema:
        default: 20
        maximum: 100
        minimum: 1
        type: integer
    StandardId:
      in: path
      name: standardId
      required: true
      schema:
        pattern: ^STD-[A-Za-z0-9-]+$
        type: string
    StandardVersionId:
      in: path
      name: standardVersionId
      required: true
      schema:
        pattern: ^STDVER-[A-Za-z0-9-]+$
        type: string
    AdvertisementId:
      in: path
      name: advertisementId
      required: true
      schema:
        type: string
        pattern: ^ADV-[A-Za-z0-9-]+$
    ReviewId:
      in: path
      name: reviewId
      required: true
      schema:
        type: string
        pattern: ^REV-[A-Za-z0-9-]+$
    ReviewItemId:
      in: path
      name: reviewItemId
      required: true
      schema:
        type: string
        pattern: ^ITEM-[A-Za-z0-9-]+$
    ReviewTypeQuery:
      in: query
      name: reviewType
      schema:
        $ref: "#/components/schemas/ReviewType"
    RiskLevelQuery:
      in: query
      name: riskLevel
      schema:
        $ref: "#/components/schemas/RiskLevel"
    ResultStatusQuery:
      in: query
      name: resultStatus
      schema:
        $ref: "#/components/schemas/ReviewResultStatus"
    EvidenceRequiredQuery:
      in: query
      name: evidenceRequired
      schema:
        type: boolean
    IncludeAppropriateQuery:
      in: query
      name: includeAppropriate
      description: Includes appropriate items; omitted values show actionable results only.
      schema:
        type: boolean
        default: false
    PageNoQuery:
      in: query
      name: pageNo
      schema:
        type: integer
        minimum: 1
    SuggestionId:
      in: path
      name: suggestionId
      required: true
      schema:
        type: string
        pattern: ^SUG-[A-Za-z0-9-]+$
    DraftId:
      in: path
      name: draftId
      required: true
      schema:
        type: string
        pattern: ^DRAFT-[A-Za-z0-9-]+$
    ReportId:
      in: path
      name: reportId
      required: true
      schema:
        type: string
        pattern: ^RPT-[A-Za-z0-9-]+$
    ComparisonId:
      in: path
      name: comparisonId
      required: true
      schema:
        type: string
        pattern: ^CMP-[A-Za-z0-9-]+$
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Request validation or file integrity failed.
    Conflict:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Duplicate or conflicting request.
    Forbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Authenticated caller is outside the permitted role or resource scope.
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Resource not found.
    PayloadTooLarge:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Uploaded file exceeds the 50 MiB limit.
    SearchUnavailable:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Qdrant, OpenSearch, or index consistency is unavailable; no keyword-only or vector-only
        fallback is returned as normal evidence.
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Authentication failed without revealing account state.
    UnsupportedMediaType:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Uploaded file extension, media type, or signature is unsupported.
