components:
  schemas:
    AccessTokenResponse:
      properties:
        accessToken:
          type: string
          minLength: 1
          title: Accesstoken
        tokenType:
          type: string
          const: Bearer
          title: Tokentype
        expiresIn:
          type: integer
          const: 1800
          title: Expiresin
      additionalProperties: false
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
      title: AccessTokenResponse
    AdvertisementCreated:
      properties:
        advertisementId:
          type: string
          title: Advertisementid
        advertisementName:
          type: string
          title: Advertisementname
        reviewStatus:
          $ref: "#/components/schemas/ReviewStatus"
        files:
          items:
            $ref: "#/components/schemas/AdvertisementFile"
          type: array
          minItems: 1
          title: Files
        createdAt:
          type: string
          format: date-time
          title: Createdat
      additionalProperties: false
      type: object
      required:
        - advertisementId
        - advertisementName
        - reviewStatus
        - files
        - createdAt
      title: AdvertisementCreated
    AdvertisementDetail:
      properties:
        advertisementId:
          type: string
          title: Advertisementid
        advertisementName:
          type: string
          title: Advertisementname
        productGroup:
          $ref: "#/components/schemas/ProductGroup"
        advertisementType:
          $ref: "#/components/schemas/AdvertisementType"
        departmentId:
          type: string
          title: Departmentid
        registeredBy:
          type: string
          title: Registeredby
        registeredAt:
          type: string
          format: date-time
          title: Registeredat
        reviewStatus:
          $ref: "#/components/schemas/ReviewStatus"
        channelType:
          anyOf:
            - type: string
            - type: "null"
          title: Channeltype
        memo:
          anyOf:
            - type: string
            - type: "null"
          title: Memo
        files:
          items:
            $ref: "#/components/schemas/AdvertisementFile"
          type: array
          title: Files
      additionalProperties: false
      type: object
      required:
        - advertisementId
        - advertisementName
        - productGroup
        - advertisementType
        - departmentId
        - registeredBy
        - registeredAt
        - reviewStatus
        - files
      title: AdvertisementDetail
    AdvertisementFile:
      properties:
        fileId:
          type: string
          title: Fileid
        fileType:
          $ref: "#/components/schemas/FileType"
        fileName:
          type: string
          title: Filename
        mimeType:
          type: string
          title: Mimetype
        fileSize:
          type: integer
          maximum: 52428800
          minimum: 0
          title: Filesize
      additionalProperties: false
      type: object
      required:
        - fileId
        - fileType
        - fileName
        - mimeType
        - fileSize
      title: AdvertisementFile
    AdvertisementPage:
      properties:
        contents:
          items:
            $ref: "#/components/schemas/AdvertisementSummary"
          type: array
          title: Contents
        page:
          type: integer
          minimum: 1
          title: Page
        size:
          type: integer
          minimum: 1
          title: Size
        totalElements:
          type: integer
          minimum: 0
          title: Totalelements
        totalPages:
          type: integer
          minimum: 0
          title: Totalpages
      additionalProperties: false
      type: object
      required:
        - contents
        - page
        - size
        - totalElements
        - totalPages
      title: AdvertisementPage
    AdvertisementSummary:
      properties:
        advertisementId:
          type: string
          title: Advertisementid
        advertisementName:
          type: string
          title: Advertisementname
        productGroup:
          $ref: "#/components/schemas/ProductGroup"
        advertisementType:
          $ref: "#/components/schemas/AdvertisementType"
        departmentId:
          type: string
          title: Departmentid
        registeredBy:
          type: string
          title: Registeredby
        registeredAt:
          type: string
          format: date-time
          title: Registeredat
        reviewStatus:
          $ref: "#/components/schemas/ReviewStatus"
      additionalProperties: false
      type: object
      required:
        - advertisementId
        - advertisementName
        - productGroup
        - advertisementType
        - departmentId
        - registeredBy
        - registeredAt
        - reviewStatus
      title: AdvertisementSummary
    AdvertisementType:
      enum:
        - BRANCH_FLYER
        - NOTICE
        - MOBILE_BANNER
        - WEB_BANNER
        - WEB_PRODUCT_PAGE
        - EVENT_PAGE
        - SOCIAL_MEDIA
        - VIDEO
        - EMAIL
        - OUTDOOR
        - PRINT_AD
        - PUSH
        - SMS
        - ALIMTALK
        - OTHER
      type: string
    AuditLogPage:
      properties:
        contents:
          items:
            $ref: "#/components/schemas/AuditLogSummary"
          type: array
          title: Contents
        page:
          type: integer
          minimum: 1
          title: Page
        size:
          type: integer
          minimum: 1
          title: Size
        totalElements:
          type: integer
          minimum: 0
          title: Totalelements
        totalPages:
          type: integer
          minimum: 0
          title: Totalpages
      additionalProperties: false
      type: object
      required:
        - contents
        - page
        - size
        - totalElements
        - totalPages
      title: AuditLogPage
    AuditLogSummary:
      properties:
        auditLogId:
          type: string
          format: uuid
          title: Auditlogid
        actorId:
          anyOf:
            - type: string
            - type: "null"
          title: Actorid
        actorDepartmentId:
          anyOf:
            - type: string
            - type: "null"
          title: Actordepartmentid
        actorRole:
          anyOf:
            - $ref: "#/components/schemas/Role"
            - type: "null"
        actionType:
          type: string
          title: Actiontype
        targetType:
          type: string
          title: Targettype
        targetId:
          anyOf:
