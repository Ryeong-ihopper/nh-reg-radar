openapi: 3.1.0
info:
  title: NH Advertisement Compliance API
  description: >-
    Source contract for the advertisement-compliance PoC. This revision is
    bounded through M3 authentication, advertisement input, immutable
    standards, evidence, reindex, and deterministic search capabilities.
  version: 0.3.0
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Common
  - name: Advertisements
  - name: Files
  - name: Audit
  - name: Standards
  - name: Evidence
  - name: Search Operations
security:
  - BearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      description: Authenticates a local PoC user and starts a rotating refresh session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access token issued and refreshToken cookie set.
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie; Secure outside local development.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
              example:
                accessToken: synthetic.jwt.value
                tokenType: Bearer
                expiresIn: 1800
                user:
                  userId: USR-SYNTH-PRODUCT
                  userName: Synthetic Product User
                  departmentId: DPT-SYNTH-PRODUCT
                  departmentName: Synthetic Product Team
                  roles: [PRODUCT_DEPARTMENT_USER]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAccessToken
      description: Rotates a valid refresh session after browser-origin validation.
      security:
        - RefreshCookie: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Rotated refresh session and new access token.
          headers:
            Set-Cookie:
              description: Rotated HttpOnly refresh token cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      description: Revokes the current refresh session after browser-origin validation.
      security:
        - RefreshCookie: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: Refresh session revoked and cookie cleared.
          headers:
            Set-Cookie:
              description: Expired refresh token cookie.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      description: Resolves the authenticated user, roles, and department scope.
      responses:
        '200':
          description: Current authenticated user context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContext'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /codes/{codeGroup}:
    get:
      tags: [Common]
      operationId: listCommonCodes
      description: Lists enabled M2 master codes for a supported code group.
      parameters:
        - name: codeGroup
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CodeGroup'
      responses:
        '200':
          description: Enabled common codes in display order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommonCode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /advertisements:
    get:
      tags: [Advertisements]
      operationId: listAdvertisements
      description: Results are filtered to the caller's role and department scope.
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/ProductGroupQuery'
        - $ref: '#/components/parameters/AdvertisementTypeQuery'
        - $ref: '#/components/parameters/ReviewStatusQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Scope-filtered advertisement page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvertisementPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Advertisements]
      operationId: createAdvertisement
      description: Validates and stores one advertisement with its allowed attachments.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateAdvertisementRequest'
      responses:
        '201':
          description: Advertisement and file metadata created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvertisementCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /advertisements/{advertisementId}:
    get:
      tags: [Advertisements]
      operationId: getAdvertisement
      description: Out-of-scope access is denied and recorded without sensitive content.
      parameters:
        - $ref: '#/components/parameters/AdvertisementId'
      responses:
        '200':
          description: Advertisement detail visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvertisementDetail'
              example:
                advertisementId: ADV-SYNTH-0001
                advertisementName: Synthetic mobile banner
                productGroup: SAVINGS
                advertisementType: MOBILE_BANNER
                departmentId: DPT-SYNTH-PRODUCT
                registeredBy: USR-SYNTH-PRODUCT
                registeredAt: '2026-07-14T06:00:00Z'
                reviewStatus: UPLOADED
                channelType: MOBILE_APP
                memo: Synthetic fixture only
                files:
                  - fileId: FILE-SYNTH-0001
                    fileType: ADVERTISEMENT
                    fileName: synthetic-advertisement.png
                    mimeType: image/png
                    fileSize: 68
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /files/{fileId}/preview:
    get:
      tags: [Files]
      operationId: getFilePreview
      description: >-
        Returns a backend-proxy preview route after authorization. Storage keys
        and presigned URLs are never returned.
      parameters:
        - $ref: '#/components/parameters/FileId'
        - name: pageNo
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Authorized preview descriptor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /files/{fileId}/download:
    get:
      tags: [Files]
      operationId: downloadFile
      description: Streams an authorized file through the backend proxy.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Authorized file stream.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /files/{fileId}/preview/content:
    get:
      tags: [Files]
      operationId: getFilePreviewContent
      description: Streams one authorized rendered preview page through the backend proxy.
      parameters:
        - $ref: '#/components/parameters/FileId'
        - name: pageNo
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Authorized rendered preview page.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/audit-logs:
    get:
      tags: [Audit]
      operationId: listAuditLogs
      description: Returns redacted audit metadata to SYSTEM_ADMIN only.
      parameters:
        - name: userId
          in: query
          schema:
            type: string
        - name: actionType
          in: query
          schema:
            type: string
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Redacted audit log page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /standards:
    get:
      tags: [Standards]
      operationId: listStandards
      description: Lists standards for standard managers and system administrators.
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - name: evidenceType
          in: query
          schema:
            $ref: '#/components/schemas/EvidenceType'
        - $ref: '#/components/parameters/ProductGroupQuery'
        - $ref: '#/components/parameters/AdvertisementTypeQuery'
        - name: ruleType
          in: query
          schema:
            $ref: '#/components/schemas/RuleType'
        - name: activeOnly
          in: query
          schema:
            type: boolean
            default: true
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Scope-authorized standards page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Standards]
      operationId: createStandard
      description: Creates a standard and immutable version 1.0 from directly entered text.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateStandardRequest'
      responses:
        '201':
          description: Standard, immutable version, and evidence created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /standards/{standardId}:
    get:
      tags: [Standards]
      operationId: getStandard
      description: Returns the standard master with its current immutable version.
      parameters:
        - $ref: '#/components/parameters/StandardId'
      responses:
        '200':
          description: Current standard master and immutable version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Standards]
      operationId: updateStandard
      description: Appends a new immutable standard version; it never overwrites history.
      parameters:
        - $ref: '#/components/parameters/StandardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStandardRequest'
      responses:
        '200':
          description: Newly created immutable version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /standards/{standardId}/deactivate:
    patch:
      tags: [Standards]
      operationId: deactivateStandard
      description: Soft-deactivates a standard and excludes its chunks from search.
      parameters:
        - $ref: '#/components/parameters/StandardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateStandardRequest'
      responses:
        '200':
          description: Deactivated standard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /standards/{standardId}/histories:
    get:
      tags: [Standards]
      operationId: listStandardHistories
      description: Lists immutable versions in descending effective/version order.
      parameters:
        - $ref: '#/components/parameters/StandardId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Immutable version history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardHistoryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /evidences/search:
    get:
      tags: [Evidence]
      operationId: searchEvidences
      description: >-
        Searches only active, basis-date-valid chunks. Hybrid mode requires
        both Qdrant and OpenSearch; a backend failure is never converted to a
        keyword-only or vector-only success.
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 300
        - name: evidenceType
          in: query
          schema:
            $ref: '#/components/schemas/EvidenceType'
        - $ref: '#/components/parameters/ProductGroupQuery'
        - $ref: '#/components/parameters/AdvertisementTypeQuery'
        - name: ruleType
          in: query
          schema:
            $ref: '#/components/schemas/RuleType'
        - name: effectiveDate
          in: query
          schema:
            type: string
            format: date
        - name: searchMode
          in: query
          schema:
            $ref: '#/components/schemas/SearchMode'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
      responses:
        '200':
          description: Deterministically ranked evidence chunks.
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/EvidenceSearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/SearchUnavailable'
  /evidences/{evidenceId}:
    get:
      tags: [Evidence]
      operationId: getEvidence
      description: Returns evidence bound to one immutable standard version.
      parameters:
        - $ref: '#/components/parameters/EvidenceId'
      responses:
        '200':
          description: Evidence detail for the selected immutable standard version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /standards/{standardId}/versions/{standardVersionId}/reindex:
    post:
      tags: [Search Operations]
      operationId: requestStandardReindex
      description: Queues an idempotent deterministic-ID reindex for directly entered text.
      parameters:
        - $ref: '#/components/parameters/StandardId'
        - $ref: '#/components/parameters/StandardVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReindexStandardRequest'
      responses:
        '202':
          description: Reindex job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardReindexJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/SearchUnavailable'
  /standard-reindex-jobs/{jobId}:
    get:
      tags: [Search Operations]
      operationId: getStandardReindexJob
      description: Returns independent Qdrant and OpenSearch processing states.
      parameters:
        - $ref: '#/components/parameters/ReindexJobId'
      responses:
        '200':
          description: Reindex status including independent backend results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardReindexJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SearchUnavailable'
  /evidences/{evidenceId}/chunks:
    get:
      tags: [Search Operations]
      operationId: listEvidenceChunks
      description: Administrator-only chunk inspection without internal index identifiers.
      parameters:
        - $ref: '#/components/parameters/EvidenceId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Redacted evidence chunk page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceChunkPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /evidence-chunks/{evidenceChunkId}:
    get:
      tags: [Search Operations]
      operationId: getEvidenceChunk
      description: Administrator-only redacted chunk detail.
      parameters:
        - $ref: '#/components/parameters/EvidenceChunkId'
      responses:
        '200':
          description: Redacted evidence chunk detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceChunk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RefreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
    AdvertisementId:
      name: advertisementId
      in: path
      required: true
      schema:
        type: string
        pattern: '^ADV-[A-Za-z0-9-]+$'
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        pattern: '^FILE-[A-Za-z0-9-]+$'
    StandardId:
      name: standardId
      in: path
      required: true
      schema:
        type: string
        pattern: '^STD-[A-Za-z0-9-]+$'
    StandardVersionId:
      name: standardVersionId
      in: path
      required: true
      schema:
        type: string
        pattern: '^STDVER-[A-Za-z0-9-]+$'
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        type: string
        pattern: '^EVD-[A-Za-z0-9-]+$'
    EvidenceChunkId:
      name: evidenceChunkId
      in: path
      required: true
      schema:
        type: string
        pattern: '^ECH-[A-Za-z0-9-]+$'
    ReindexJobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        pattern: '^SRJ-[A-Za-z0-9-]+$'
    Keyword:
      name: keyword
      in: query
      schema:
        type: string
        maxLength: 300
    ProductGroupQuery:
      name: productGroup
      in: query
      schema:
        $ref: '#/components/schemas/ProductGroup'
    AdvertisementTypeQuery:
      name: advertisementType
      in: query
      schema:
        $ref: '#/components/schemas/AdvertisementType'
    ReviewStatusQuery:
      name: reviewStatus
      in: query
      schema:
        $ref: '#/components/schemas/ReviewStatus'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Request validation or file integrity failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed without revealing account state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated caller is outside the permitted role or resource scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Duplicate or conflicting request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: A file exceeded the 50 MiB limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: File extension or MIME type is not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Login IP rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SearchUnavailable:
      description: >-
        Qdrant, OpenSearch, or index consistency is unavailable; no
        keyword-only or vector-only fallback is returned as normal evidence.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, traceId, timestamp]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        details:
          type: array
          items:
            type: object
            additionalProperties: true
        traceId:
          type: string
          minLength: 1
        timestamp:
          type: string
          format: date-time
      example:
        code: FILE_NOT_SUPPORTED
        message: 지원하지 않는 파일 형식입니다.
        details:
          - field: advertisementFile
            reason: jpg, jpeg, png, pdf, hwp, hwpx 파일만 업로드할 수 있습니다.
        traceId: req-example-000001
        timestamp: '2026-07-14T06:00:00Z'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 10
          maxLength: 256
          writeOnly: true
    AccessTokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          minLength: 1
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          const: 1800
    AuthTokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          minLength: 1
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          const: 1800
        user:
          $ref: '#/components/schemas/UserContext'
