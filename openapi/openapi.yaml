openapi: 3.1.0
info:
  title: NH Advertisement Compliance API
  description: >-
    Source contract for the advertisement-compliance PoC. This revision is bounded through M5 authentication, advertisement input, immutable standards/search, asynchronous Review/Job/Parser, and evidence-backed result/Annotation contracts.
  version: 0.5.0
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Common
  - name: Advertisements
  - name: Files
  - name: Audit
  - name: Standards
  - name: Evidence
  - name: Search Operations
  - name: Reviews
  - name: Review Results
  - name: Annotations
security:
  - BearerAuth: []
paths:
  /auth/login:
    post:
      tags: [ Auth ]
      operationId: login
      description: Authenticates a local PoC user and starts a rotating refresh session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access token issued and refreshToken cookie set.
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie; Secure outside local development.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
              example:
                accessToken: synthetic.jwt.value
                tokenType: Bearer
                expiresIn: 1800
                user:
                  userId: USR-SYNTH-PRODUCT
                  userName: Synthetic Product User
                  departmentId: DPT-SYNTH-PRODUCT
                  departmentName: Synthetic Product Team
                  roles: [ PRODUCT_DEPARTMENT_USER ]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      tags: [ Auth ]
      operationId: refreshAccessToken
      description: Rotates a valid refresh session after browser-origin validation.
      security:
        - RefreshCookie: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Rotated refresh session and new access token.
          headers:
            Set-Cookie:
              description: Rotated HttpOnly refresh token cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/logout:
    post:
      tags: [ Auth ]
      operationId: logout
      description: Revokes the current refresh session after browser-origin validation.
      security:
        - RefreshCookie: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: Refresh session revoked and cookie cleared.
          headers:
            Set-Cookie:
              description: Expired refresh token cookie.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/me:
    get:
      tags: [ Auth ]
      operationId: getCurrentUser
      description: Resolves the authenticated user, roles, and department scope.
      responses:
        '200':
          description: Current authenticated user context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContext'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /codes/{codeGroup}:
    get:
      tags: [ Common ]
      operationId: listCommonCodes
      description: Lists enabled M2 master codes for a supported code group.
      parameters:
        - name: codeGroup
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CodeGroup'
      responses:
        '200':
          description: Enabled common codes in display order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommonCode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /advertisements:
    get:
      tags: [ Advertisements ]
      operationId: listAdvertisements
      description: Results are filtered to the caller's role and department scope.
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/ProductGroupQuery'
        - $ref: '#/components/parameters/AdvertisementTypeQuery'
        - $ref: '#/components/parameters/ReviewStatusQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Scope-filtered advertisement page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvertisementPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [ Advertisements ]
      operationId: createAdvertisement
      description: Validates and stores one advertisement with its allowed attachments.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateAdvertisementRequest'
      responses:
        '201':
          description: Advertisement and file metadata created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvertisementCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /advertisements/{advertisementId}:
    get:
      tags: [ Advertisements ]
      operationId: getAdvertisement
      description: Out-of-scope access is denied and recorded without sensitive content.
      parameters:
        - $ref: '#/components/parameters/AdvertisementId'
      responses:
        '200':
          description: Advertisement detail visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvertisementDetail'
              example:
                advertisementId: ADV-SYNTH-0001
                advertisementName: Synthetic mobile banner
                productGroup: SAVINGS
                advertisementType: MOBILE_BANNER
                departmentId: DPT-SYNTH-PRODUCT
                registeredBy: USR-SYNTH-PRODUCT
                registeredAt: '2026-07-14T06:00:00Z'
                reviewStatus: UPLOADED
                channelType: MOBILE_APP
                memo: Synthetic fixture only
                files:
                  - fileId: FILE-SYNTH-0001
                    fileType: ADVERTISEMENT
                    fileName: synthetic-advertisement.png
                    mimeType: image/png
                    fileSize: 68
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /files/{fileId}/preview:
    get:
      tags: [ Files ]
      operationId: getFilePreview
      description: >-
        Returns a backend-proxy preview route after authorization. Storage keys and presigned URLs are never returned.
      parameters:
        - $ref: '#/components/parameters/FileId'
        - name: pageNo
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        '200':
          description: Authorized preview descriptor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /files/{fileId}/download:
    get:
      tags: [ Files ]
      operationId: downloadFile
      description: Streams an authorized file through the backend proxy.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Authorized file stream.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /files/{fileId}/preview/content:
    get:
      tags: [ Files ]
      operationId: getFilePreviewContent
      description: Streams one authorized rendered preview page through the backend proxy.
      parameters:
        - $ref: '#/components/parameters/FileId'
        - name: pageNo
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Authorized rendered preview page.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/audit-logs:
    get:
      tags: [ Audit ]
      operationId: listAuditLogs
      description: Returns redacted audit metadata to SYSTEM_ADMIN only.
      parameters:
        - name: userId
          in: query
          schema:
            type: string
        - name: actionType
          in: query
          schema:
            type: string
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Redacted audit log page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /standards:
    get:
      tags: [ Standards ]
      operationId: listStandards
      description: Lists standards for standard managers and system administrators.
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - name: evidenceType
          in: query
          schema:
            $ref: '#/components/schemas/EvidenceType'
        - $ref: '#/components/parameters/ProductGroupQuery'
        - $ref: '#/components/parameters/AdvertisementTypeQuery'
        - name: ruleType
          in: query
          schema:
            $ref: '#/components/schemas/RuleType'
        - name: activeOnly
          in: query
          schema:
            type: boolean
            default: true
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Scope-authorized standards page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [ Standards ]
      operationId: createStandard
      description: Creates a standard and immutable version 1.0 from directly entered text.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateStandardRequest'
      responses:
        '201':
          description: Standard, immutable version, and evidence created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /standards/{standardId}:
    get:
      tags: [ Standards ]
      operationId: getStandard
      description: Returns the standard master with its current immutable version.
      parameters:
        - $ref: '#/components/parameters/StandardId'
      responses:
        '200':
          description: Current standard master and immutable version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [ Standards ]
      operationId: updateStandard
      description: Appends a new immutable standard version; it never overwrites history.
      parameters:
        - $ref: '#/components/parameters/StandardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStandardRequest'
      responses:
        '200':
          description: Newly created immutable version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /standards/{standardId}/deactivate:
    patch:
      tags: [ Standards ]
      operationId: deactivateStandard
      description: Soft-deactivates a standard and excludes its chunks from search.
      parameters:
        - $ref: '#/components/parameters/StandardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateStandardRequest'
      responses:
        '200':
          description: Deactivated standard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /standards/{standardId}/histories:
    get:
      tags: [ Standards ]
      operationId: listStandardHistories
      description: Lists immutable versions in descending effective/version order.
      parameters:
        - $ref: '#/components/parameters/StandardId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Immutable version history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardHistoryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /evidences/search:
    get:
      tags: [ Evidence ]
      operationId: searchEvidences
      description: >-
        Searches only active, basis-date-valid chunks. Hybrid mode requires both Qdrant and OpenSearch; a backend failure is never converted to a keyword-only or vector-only success.
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 300
        - name: evidenceType
          in: query
          schema:
            $ref: '#/components/schemas/EvidenceType'
        - $ref: '#/components/parameters/ProductGroupQuery'
        - $ref: '#/components/parameters/AdvertisementTypeQuery'
        - name: ruleType
          in: query
          schema:
            $ref: '#/components/schemas/RuleType'
        - name: effectiveDate
          in: query
          schema:
            type: string
            format: date
        - name: searchMode
          in: query
          schema:
            $ref: '#/components/schemas/SearchMode'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
      responses:
        '200':
          description: Deterministically ranked evidence chunks.
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/EvidenceSearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/SearchUnavailable'
  /evidences/{evidenceId}:
    get:
      tags: [ Evidence ]
      operationId: getEvidence
      description: Returns evidence bound to one immutable standard version.
      parameters:
        - $ref: '#/components/parameters/EvidenceId'
      responses:
        '200':
          description: Evidence detail for the selected immutable standard version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /standards/{standardId}/versions/{standardVersionId}/reindex:
    post:
      tags: [ Search Operations ]
      operationId: requestStandardReindex
      description: Queues an idempotent deterministic-ID reindex for directly entered text.
      parameters:
        - $ref: '#/components/parameters/StandardId'
        - $ref: '#/components/parameters/StandardVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReindexStandardRequest'
      responses:
        '202':
          description: Reindex job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardReindexJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/SearchUnavailable'
  /standard-reindex-jobs/{jobId}:
    get:
      tags: [ Search Operations ]
      operationId: getStandardReindexJob
      description: Returns independent Qdrant and OpenSearch processing states.
      parameters:
        - $ref: '#/components/parameters/ReindexJobId'
      responses:
        '200':
          description: Reindex status including independent backend results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardReindexJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/SearchUnavailable'
  /evidences/{evidenceId}/chunks:
    get:
      tags: [ Search Operations ]
      operationId: listEvidenceChunks
      description: Administrator-only chunk inspection without internal index identifiers.
      parameters:
        - $ref: '#/components/parameters/EvidenceId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Redacted evidence chunk page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceChunkPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /evidence-chunks/{evidenceChunkId}:
    get:
      tags: [ Search Operations ]
      operationId: getEvidenceChunk
      description: Administrator-only redacted chunk detail.
      parameters:
        - $ref: '#/components/parameters/EvidenceChunkId'
      responses:
        '200':
          description: Redacted evidence chunk detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceChunk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /advertisements/{advertisementId}/reviews:
    post:
      tags:
        - Reviews
      operationId: requestAdvertisementReview
      description: Persists review/job/steps before minimal Redis delivery.
      parameters:
        - $ref: "#/components/parameters/AdvertisementId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "202":
          description: Review job accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags:
        - Reviews
      operationId: listAdvertisementReviews
      description: Lists immutable review rounds for an advertisement.
      parameters:
        - $ref: "#/components/parameters/AdvertisementId"
      responses:
        "200":
          description: Immutable review history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewHistory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /reviews/{reviewId}/status:
    get:
      tags:
        - Reviews
      operationId: getReviewStatus
      description: Returns PostgreSQL-sourced job and step progress.
      parameters:
        - $ref: "#/components/parameters/ReviewId"
      responses:
        "200":
          description: PostgreSQL-sourced job and step progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /reviews/{reviewId}/rerun:
    post:
      tags:
        - Reviews
      operationId: rerunReview
      description: Creates a new review round without overwriting history.
      parameters:
        - $ref: "#/components/parameters/ReviewId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RerunReviewRequest"
      responses:
        "202":
          description: New review round accepted without overwriting history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RerunReviewAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /reviews/{reviewId}/summary:
    get:
      tags:
      - Review Results
      operationId: getReviewSummary
      description: Returns the immutable standard-version snapshot and risk summary.
      parameters:
      - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: Scoped review result returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /reviews/{reviewId}/items:
    get:
      tags:
      - Review Results
      operationId: listReviewItems
      description: Lists scoped result items without hiding evidence insufficiency or
        search failure.
      parameters:
      - $ref: '#/components/parameters/ReviewId'
      - $ref: '#/components/parameters/ReviewTypeQuery'
      - $ref: '#/components/parameters/RiskLevelQuery'
      - $ref: '#/components/parameters/ResultStatusQuery'
      - $ref: '#/components/parameters/EvidenceRequiredQuery'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Scoped review result returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewItemPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /reviews/{reviewId}/items/{reviewItemId}:
    get:
      tags:
      - Review Results
      operationId: getReviewItem
      description: Returns risk rationale, frozen evidence versions, and optional display
        location.
      parameters:
      - $ref: '#/components/parameters/ReviewId'
      - $ref: '#/components/parameters/ReviewItemId'
      responses:
        '200':
          description: Scoped review result returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewItemDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /reviews/{reviewId}/annotations:
    get:
      tags:
      - Annotations
      operationId: listReviewAnnotations
      description: Returns BOX, TEXT_HIGHLIGHT, or list fallback annotations.
      parameters:
      - $ref: '#/components/parameters/ReviewId'
      - $ref: '#/components/parameters/PageNoQuery'
      - $ref: '#/components/parameters/ReviewTypeQuery'
      - $ref: '#/components/parameters/RiskLevelQuery'
      responses:
        '200':
          description: Scoped review result returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationCollection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RefreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
    AdvertisementId:
      in: path
      name: advertisementId
      required: true
      schema:
        type: string
        pattern: ^ADV-[A-Za-z0-9-]+$
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        pattern: '^FILE-[A-Za-z0-9-]+$'
    StandardId:
      name: standardId
      in: path
      required: true
      schema:
        type: string
        pattern: '^STD-[A-Za-z0-9-]+$'
    StandardVersionId:
      name: standardVersionId
      in: path
      required: true
      schema:
        type: string
        pattern: '^STDVER-[A-Za-z0-9-]+$'
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        type: string
        pattern: '^EVD-[A-Za-z0-9-]+$'
    EvidenceChunkId:
      name: evidenceChunkId
      in: path
      required: true
      schema:
        type: string
        pattern: '^ECH-[A-Za-z0-9-]+$'
    ReindexJobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        pattern: '^SRJ-[A-Za-z0-9-]+$'
    Keyword:
      name: keyword
      in: query
      schema:
        type: string
        maxLength: 300
    ProductGroupQuery:
      name: productGroup
      in: query
      schema:
        $ref: '#/components/schemas/ProductGroup'
    AdvertisementTypeQuery:
      name: advertisementType
      in: query
      schema:
        $ref: '#/components/schemas/AdvertisementType'
    ReviewStatusQuery:
      name: reviewStatus
      in: query
      schema:
        $ref: '#/components/schemas/ReviewStatus'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ReviewId:
      in: path
      name: reviewId
      required: true
      schema:
        type: string
        pattern: ^REV-[A-Za-z0-9-]+$
    ReviewItemId:
      in: path
      name: reviewItemId
      required: true
      schema:
        type: string
        pattern: ^ITEM-[A-Za-z0-9-]+$
    ReviewTypeQuery:
      in: query
      name: reviewType
      schema:
        $ref: '#/components/schemas/ReviewType'
    RiskLevelQuery:
      in: query
      name: riskLevel
      schema:
        $ref: '#/components/schemas/RiskLevel'
    ResultStatusQuery:
      in: query
      name: resultStatus
      schema:
        $ref: '#/components/schemas/ReviewResultStatus'
    EvidenceRequiredQuery:
      in: query
      name: evidenceRequired
      schema:
        type: boolean
    PageNoQuery:
      in: query
      name: pageNo
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Request validation or file integrity failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed without revealing account state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated caller is outside the permitted role or resource scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Duplicate or conflicting request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: A file exceeded the 50 MiB limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: File extension or MIME type is not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Login IP rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SearchUnavailable:
      description: >-
        Qdrant, OpenSearch, or index consistency is unavailable; no keyword-only or vector-only fallback is returned as normal evidence.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RiskLevel:
      type: string
      enum:
      - HIGH
      - MEDIUM
      - LOW
      - CHECK_REQUIRED
    ReviewResultStatus:
      type: string
      enum:
      - APPROPRIATE
      - NEEDS_REVISION
      - NEEDS_CONFIRMATION
    EvidenceStatus:
      type: string
      enum:
      - CONNECTED
      - NOT_REQUIRED
      - INSUFFICIENT
      - SEARCH_UNAVAILABLE
    ReviewEngineType:
      type: string
      enum:
      - RULE
      - RAG
      - MULTIMODAL
      - LLM
    StructuredOutputStatus:
      type: string
      enum:
      - NOT_RUN
      - VALID
      - INVALID_SCHEMA
    AnnotationDisplayMode:
      type: string
      enum:
      - BOX
      - TEXT_HIGHLIGHT
      - LIST_ONLY
      - UNAVAILABLE
    AnnotationStatus:
      type: string
      enum:
      - LOCATED
      - PARTIALLY_LOCATED
      - NOT_LOCATED
      - LOW_CONFIDENCE
      - DOCUMENT_LEVEL_ISSUE
    RiskRuleScore:
      type: object
      additionalProperties: false
      required:
      - matched
      - ruleIds
      - severity
      properties:
        matched:
          type: boolean
        ruleIds:
          type: array
          items:
            type: string
        severity:
          oneOf:
          - $ref: '#/components/schemas/RiskLevel'
          - type: 'null'
    RiskRagScore:
      type: object
      additionalProperties: false
      required:
      - topRelevanceScore
      - evidenceCount
      - evidenceSufficient
      - status
      - failureCode
      properties:
        topRelevanceScore:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        evidenceCount:
          type: integer
          minimum: 0
          maximum: 5
        evidenceSufficient:
          type: boolean
        status:
          $ref: '#/components/schemas/EvidenceStatus'
        failureCode:
          oneOf:
          - type: string
            enum:
            - RAG_SEARCH_UNAVAILABLE
            - RAG_SEARCH_FAILED
          - type: 'null'
    RiskLlmScore:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - status
      - decision
      - confidence
      properties:
        schemaVersion:
          const: review-structured-output-v1
          type: string
        status:
          $ref: '#/components/schemas/StructuredOutputStatus'
        decision:
          type:
          - string
          - 'null'
        confidence:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
    RiskParserScore:
      type: object
      additionalProperties: false
      required:
      - confidenceStatus
      properties:
        confidenceStatus:
          $ref: '#/components/schemas/ConfidenceStatus'
    RiskFinalScore:
      type: object
      additionalProperties: false
      required:
      - riskLevel
      - decisionRule
      properties:
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
        decisionRule:
          type: string
          minLength: 1
    RiskScoreDetail:
      type: object
      additionalProperties: false
      required:
      - rule
      - rag
      - llm
      - parser
      - final
      properties:
        rule:
          $ref: '#/components/schemas/RiskRuleScore'
        rag:
          $ref: '#/components/schemas/RiskRagScore'
        llm:
          $ref: '#/components/schemas/RiskLlmScore'
        parser:
          $ref: '#/components/schemas/RiskParserScore'
        final:
          $ref: '#/components/schemas/RiskFinalScore'
    RiskRationale:
      type: object
      additionalProperties: false
      required:
      - riskLevel
      - policyVersion
      - reasonCodes
      - scoreDetail
      properties:
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
        policyVersion:
          type: string
          minLength: 1
        reasonCodes:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          uniqueItems: true
        scoreDetail:
          $ref: '#/components/schemas/RiskScoreDetail'
    ReviewTypeSummary:
      type: object
      additionalProperties: false
      required:
      - reviewType
      - totalCount
      - needsRevisionCount
      - needsConfirmationCount
      properties:
        reviewType:
          $ref: '#/components/schemas/ReviewType'
        totalCount:
          type: integer
          minimum: 0
        needsRevisionCount:
          type: integer
          minimum: 0
        needsConfirmationCount:
          type: integer
          minimum: 0
    TopRisk:
      type: object
      additionalProperties: false
      required:
      - reviewItemId
      - riskLevel
      - riskPolicyVersion
      - riskReasonCodes
      - targetText
      - reason
      - evidenceStatus
      properties:
        reviewItemId:
          type: string
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
        riskPolicyVersion:
          type: string
        riskReasonCodes:
          type: array
          items:
            type: string
        targetText:
          type: string
        reason:
          type: string
        evidenceStatus:
          $ref: '#/components/schemas/EvidenceStatus'
    ReviewSummary:
      type: object
      additionalProperties: false
      required:
      - reviewId
      - advertisementId
      - standardEffectiveDate
      - standardVersionIds
      - overallRiskLevel
      - totalItemCount
      - needsRevisionCount
      - needsConfirmationCount
      - reviewTypeSummary
      - topRisks
      - completedAt
      properties:
        reviewId:
          type: string
        advertisementId:
          type: string
        standardEffectiveDate:
          type: string
          format: date
        standardVersionIds:
          type: array
          items:
            type: string
        overallRiskLevel:
          $ref: '#/components/schemas/RiskLevel'
        totalItemCount:
          type: integer
          minimum: 0
        needsRevisionCount:
          type: integer
          minimum: 0
        needsConfirmationCount:
          type: integer
          minimum: 0
        reviewTypeSummary:
          type: array
          items:
            $ref: '#/components/schemas/ReviewTypeSummary'
        topRisks:
          type: array
          items:
            $ref: '#/components/schemas/TopRisk'
        completedAt:
          type: string
          format: date-time
    ReviewItemSummary:
      type: object
      additionalProperties: false
      required:
      - reviewItemId
      - reviewType
      - targetText
      - resultStatus
      - riskLevel
      - riskPolicyVersion
      - riskReasonCodes
      - reason
      - evidenceStatus
      - evidenceFailureCode
      - evidenceCount
      - pageNo
      - hasAnnotation
      - sourceEngine
      - sourceVersion
      properties:
        reviewItemId:
          type: string
        reviewType:
          $ref: '#/components/schemas/ReviewType'
        targetText:
          type: string
        resultStatus:
          $ref: '#/components/schemas/ReviewResultStatus'
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
        riskPolicyVersion:
          type: string
        riskReasonCodes:
          type: array
          items:
            type: string
        reason:
          type: string
        evidenceStatus:
          $ref: '#/components/schemas/EvidenceStatus'
        evidenceFailureCode:
          oneOf:
          - type: string
            enum:
            - RAG_SEARCH_UNAVAILABLE
            - RAG_SEARCH_FAILED
          - type: 'null'
        evidenceCount:
          type: integer
          minimum: 0
          maximum: 5
        pageNo:
          type:
          - integer
          - 'null'
          minimum: 1
        hasAnnotation:
          type: boolean
        sourceEngine:
          $ref: '#/components/schemas/ReviewEngineType'
        sourceVersion:
          type: string
          minLength: 1
    ReviewItemPage:
      type: object
      additionalProperties: false
      required:
      - contents
      - page
      - size
      - totalElements
      - totalPages
      properties:
        contents:
          type: array
          items:
            $ref: '#/components/schemas/ReviewItemSummary'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    ReviewItemEvidence:
      type: object
      additionalProperties: false
      required:
      - evidenceId
      - evidenceChunkId
      - standardVersionId
      - evidenceType
      - title
      - matchedText
      - rankNo
      - relevanceScore
      - matchSource
      properties:
        evidenceId:
          type: string
        evidenceChunkId:
          type:
          - string
          - 'null'
        standardVersionId:
          type: string
        evidenceType:
          $ref: '#/components/schemas/EvidenceType'
        title:
          type: string
        articleNo:
          type:
          - string
          - 'null'
        matchedText:
          type: string
        rankNo:
          type: integer
          minimum: 1
          maximum: 5
        relevanceScore:
          type: number
          minimum: 0
          maximum: 1
        matchSource:
          type: string
          enum:
          - KEYWORD
          - VECTOR
          - HYBRID
          - RULE_METADATA
    Annotation:
      type: object
      additionalProperties: false
      required:
      - annotationId
      - reviewItemId
      - reviewType
      - riskLevel
      - targetText
      - annotationDisplayMode
      - annotationStatus
      - locationConfidence
      - confidencePolicyVersion
      - displayReason
      - pageNo
      - coordinate
      - textBlockId
      - textPath
      - rawStartOffset
      - rawEndOffset
      - normalizedStartOffset
      - normalizedEndOffset
      - matchedText
      properties:
        annotationId:
          type: string
        reviewItemId:
          type: string
        reviewType:
          $ref: '#/components/schemas/ReviewType'
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
        targetText:
          type: string
        annotationDisplayMode:
          $ref: '#/components/schemas/AnnotationDisplayMode'
        annotationStatus:
          $ref: '#/components/schemas/AnnotationStatus'
        locationConfidence:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        confidencePolicyVersion:
          type: string
        displayReason:
          type: string
        pageNo:
          type:
          - integer
          - 'null'
          minimum: 1
        coordinate:
          oneOf:
          - $ref: '#/components/schemas/Coordinate'
          - type: 'null'
        textBlockId:
          type:
          - string
          - 'null'
        textPath:
          type:
          - string
          - 'null'
        rawStartOffset:
          type:
          - integer
          - 'null'
          minimum: 0
        rawEndOffset:
          type:
          - integer
          - 'null'
          minimum: 0
        normalizedStartOffset:
          type:
          - integer
          - 'null'
          minimum: 0
        normalizedEndOffset:
          type:
          - integer
          - 'null'
          minimum: 0
        matchedText:
          type:
          - string
          - 'null'
    AnnotationCollection:
      type: object
      additionalProperties: false
      required:
      - reviewId
      - fileId
      - fileType
      - pageNo
      - annotations
      properties:
        reviewId:
          type: string
        fileId:
          type: string
        fileType:
          type: string
        pageNo:
          type:
          - integer
          - 'null'
          minimum: 1
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
    ReviewItemDetail:
      allOf:
      - $ref: '#/components/schemas/ReviewItemSummary'
      - type: object
        additionalProperties: false
        required:
        - riskRationale
        - evidences
        - recommendation
        - annotation
        properties:
          riskRationale:
            $ref: '#/components/schemas/RiskRationale'
          evidences:
            type: array
            maxItems: 3
            items:
              $ref: '#/components/schemas/ReviewItemEvidence'
          recommendation:
            type:
            - string
            - 'null'
          annotation:
            oneOf:
            - $ref: '#/components/schemas/Annotation'
            - type: 'null'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [ code, message, traceId, timestamp ]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        details:
          type: array
          items:
            type: object
            additionalProperties: true
        traceId:
          type: string
          minLength: 1
        timestamp:
          type: string
          format: date-time
      example:
        code: FILE_NOT_SUPPORTED
        message: 지원하지 않는 파일 형식입니다.
        details:
          - field: advertisementFile
            reason: jpg, jpeg, png, pdf, hwp, hwpx 파일만 업로드할 수 있습니다.
        traceId: req-example-000001
        timestamp: '2026-07-14T06:00:00Z'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 10
          maxLength: 256
          writeOnly: true
    AccessTokenResponse:
      type: object
      additionalProperties: false
      required: [ accessToken, tokenType, expiresIn ]
      properties:
        accessToken:
          type: string
          minLength: 1
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          const: 1800
    AuthTokenResponse:
      type: object
      additionalProperties: false
      required: [ accessToken, tokenType, expiresIn, user ]
      properties:
        accessToken:
          type: string
          minLength: 1
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          const: 1800
        user:
          $ref: '#/components/schemas/UserContext'
    UserContext:
      type: object
      additionalProperties: false
      required: [ userId, userName, departmentId, departmentName, roles ]
      properties:
        userId:
          type: string
        userName:
          type: string
        departmentId:
          type: string
        departmentName:
          type: string
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Role'
    Role:
      type: string
      enum: [ PRODUCT_DEPARTMENT_USER, COMPLIANCE_REVIEWER, STANDARD_MANAGER, SYSTEM_ADMIN ]
    CodeGroup:
      type: string
      enum: [ product-groups, advertisement-types, review-statuses ]
    CommonCode:
      type: object
      additionalProperties: false
      required: [ code, name, sortOrder, enabled ]
      properties:
        code:
          type: string
        name:
          type: string
        sortOrder:
          type: integer
        enabled:
          type: boolean
    ProductGroup:
      type: string
      enum: [ DEPOSIT, SAVINGS, DEMAND_DEPOSIT, EVENT ]
    AdvertisementType:
      type: string
      enum: [ BRANCH_FLYER, NOTICE, MOBILE_BANNER, WEB_BANNER, EVENT_PAGE, PUSH, SMS, ALIMTALK ]
    ReviewStatus:
      type: string
      enum: [ UPLOADED, REVISED ]
    FileType:
      type: string
      enum: [ ADVERTISEMENT, PRODUCT_DESCRIPTION, TERMS, ADDITIONAL ]
    AdvertisementFile:
      type: object
      additionalProperties: false
      required: [ fileId, fileType, fileName, mimeType, fileSize ]
      properties:
        fileId:
          type: string
        fileType:
          $ref: '#/components/schemas/FileType'
        fileName:
          type: string
        mimeType:
          type: string
        fileSize:
          type: integer
          minimum: 0
          maximum: 52428800
    AdvertisementSummary:
      type: object
      additionalProperties: false
      required:
        - advertisementId
        - advertisementName
        - productGroup
        - advertisementType
        - departmentId
        - registeredBy
        - registeredAt
        - reviewStatus
      properties:
        advertisementId:
          type: string
        advertisementName:
          type: string
        productGroup:
          $ref: '#/components/schemas/ProductGroup'
        advertisementType:
          $ref: '#/components/schemas/AdvertisementType'
        departmentId:
          type: string
        registeredBy:
          type: string
        registeredAt:
          type: string
          format: date-time
        reviewStatus:
          $ref: '#/components/schemas/ReviewStatus'
    AdvertisementPage:
      type: object
      additionalProperties: false
      required: [ contents, page, size, totalElements, totalPages ]
      properties:
        contents:
          type: array
          items:
            $ref: '#/components/schemas/AdvertisementSummary'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    CreateAdvertisementRequest:
      type: object
      additionalProperties: false
      required:
        - advertisementName
        - productGroup
        - advertisementType
        - departmentId
        - advertisementFile
      properties:
        advertisementName:
          type: string
          minLength: 1
          maxLength: 300
        productGroup:
          $ref: '#/components/schemas/ProductGroup'
        advertisementType:
          $ref: '#/components/schemas/AdvertisementType'
        channelType:
          type: string
          maxLength: 50
        departmentId:
          type: string
          maxLength: 50
        memo:
          type: string
          maxLength: 2000
        advertisementFile:
          type: string
          format: binary
          description: jpg/jpeg/png/pdf/hwp/hwpx; maximum 50 MiB.
        productDescriptionFile:
          type: string
          format: binary
        termsFile:
          type: string
          format: binary
        additionalFiles:
          type: array
          maxItems: 10
          items:
            type: string
            format: binary
    AdvertisementCreated:
      type: object
      additionalProperties: false
      required: [ advertisementId, advertisementName, reviewStatus, files, createdAt ]
      properties:
        advertisementId:
          type: string
        advertisementName:
          type: string
        reviewStatus:
          $ref: '#/components/schemas/ReviewStatus'
        files:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AdvertisementFile'
        createdAt:
          type: string
          format: date-time
    AdvertisementDetail:
      type: object
      additionalProperties: false
      required:
        - advertisementId
        - advertisementName
        - productGroup
        - advertisementType
        - departmentId
        - registeredBy
        - registeredAt
        - reviewStatus
        - files
      properties:
        advertisementId:
          type: string
        advertisementName:
          type: string
        productGroup:
          $ref: '#/components/schemas/ProductGroup'
        advertisementType:
          $ref: '#/components/schemas/AdvertisementType'
        departmentId:
          type: string
        registeredBy:
          type: string
        registeredAt:
          type: string
          format: date-time
        reviewStatus:
          $ref: '#/components/schemas/ReviewStatus'
        channelType:
          type: [ string, 'null' ]
        memo:
          type: [ string, 'null' ]
        files:
          type: array
          items:
            $ref: '#/components/schemas/AdvertisementFile'
    FilePreview:
      type: object
      additionalProperties: false
      required: [ fileId, pageNo, totalPages, previewPath ]
      properties:
        fileId:
          type: string
        pageNo:
          type: integer
          minimum: 1
        totalPages:
          type: integer
          minimum: 1
        previewPath:
          type: string
          pattern: '^/api/v1/files/[^/]+/preview/content$'
        width:
          type: [ integer, 'null' ]
          minimum: 1
        height:
          type: [ integer, 'null' ]
          minimum: 1
    AuditLogSummary:
      type: object
      additionalProperties: false
      required: [ auditLogId, actionType, targetType, result, traceId, createdAt ]
      properties:
        auditLogId:
          type: string
          format: uuid
        actorId:
          type: [ string, 'null' ]
        actorDepartmentId:
          type: [ string, 'null' ]
