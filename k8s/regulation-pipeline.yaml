# 규정 변경 감지 파이프라인 — Kubernetes 배포
#
#   kubectl apply -f k8s/regulation-pipeline.yaml
#   kubectl create job --from=cronjob/regulation-change-detection manual-run-1   # 수동 실행
#
# ⚠ 저장소 주의: 아래 구성은 SQLite + ReadWriteOnce PVC 기준이라
#   배치와 API 가 같은 노드에 떠야 하고 API replicas 는 1이어야 한다.
#   다중 replica / 다중 노드로 갈 거면 sql/regulation_schema.sql 의 PostgreSQL
#   스키마로 옮기고 db.py 의 커넥션만 교체하면 된다 (테이블·컬럼명 동일).
---
apiVersion: v1
kind: Namespace
metadata:
  name: regulation
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: regulation-data
  namespace: regulation
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: regulation-config
  namespace: regulation
data:
  # 수집 대상. targets.json 을 이미지에 굽지 않고 여기서 관리하면
  # 규정 추가 시 이미지 재빌드 없이 ConfigMap 만 고치면 된다.
  targets.json: |
    [
      { "name": "금융소비자 보호에 관한 법률",              "kind": "law" },
      { "name": "금융소비자 보호에 관한 법률 시행령",        "kind": "law" },
      { "name": "금융소비자 보호에 관한 감독규정",           "kind": "admrul" },
      { "name": "금융소비자보호에 관한 감독규정 시행세칙",    "kind": "admrul" },
      { "name": "금융투자회사의 영업 및 업무에 관한 규정",     "kind": "kofia" },
      { "name": "여신전문금융회사 등의 광고에 관한 규정",       "kind": "crefia" },
      { "name": "여신전문금융회사 등의 광고에 관한 규정 세부지침", "kind": "crefia" },
      { "name": "은행 광고심의 기준 및 세칙",                 "kind": "kfb" }
    ]
---
# ── 배치: 매주 월요일 새벽 2시 변경 감지 ────────────────────────────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: regulation-change-detection
  namespace: regulation
spec:
  schedule: "0 2 * * 1"          # 매주 월 02:00 (KST)
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid      # 이전 실행이 안 끝났으면 건너뜀 (외부 사이트 부하 방지)
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2            # 협회 사이트 일시 장애 대비 2회까지 재시도
      activeDeadlineSeconds: 5400
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: change-detection
              image: regulation-pipeline:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "check_updates.py", "--cron"]
              env:
                - name: REGULATION_DB
                  value: /data/regulations.db
              volumeMounts:
                - { name: data,    mountPath: /data }
                - { name: output,  mountPath: /app/output }
                - { name: targets, mountPath: /app/targets.json, subPath: targets.json }
              resources:
                requests: { cpu: "250m", memory: "1Gi" }
                limits:   { cpu: "2",    memory: "3Gi" }   # JVM(document-processor) 여유분
          volumes:
            - { name: data,   persistentVolumeClaim: { claimName: regulation-data } }
            - { name: output, persistentVolumeClaim: { claimName: regulation-data } }
            - { name: targets, configMap: { name: regulation-config } }
---
# ── API 서버 ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: regulation-api
  namespace: regulation
spec:
  replicas: 1                    # SQLite 라 1 고정 (PostgreSQL 전환 시 증설 가능)
  strategy: { type: Recreate }   # RWO 볼륨은 롤링 업데이트 시 동시 마운트 불가
  selector:
    matchLabels: { app: regulation-api }
  template:
    metadata:
      labels: { app: regulation-api }
    spec:
      containers:
        - name: api
          image: regulation-pipeline:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - { containerPort: 8000, name: http }
          env:
            - name: REGULATION_DB
              value: /data/regulations.db
          volumeMounts:
            - { name: data,   mountPath: /data }
            - { name: output, mountPath: /app/output }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "2Gi" }
      volumes:
        - { name: data,   persistentVolumeClaim: { claimName: regulation-data } }
        - { name: output, persistentVolumeClaim: { claimName: regulation-data } }
---
apiVersion: v1
kind: Service
metadata:
  name: regulation-api
  namespace: regulation
spec:
  selector: { app: regulation-api }
  ports:
    - { port: 80, targetPort: http, name: http }
