services:
  frontend:
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          memory: 128M

  backend:
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  postgres:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  minio:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  qdrant:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  opensearch:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
